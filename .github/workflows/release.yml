name: Build & Release ImageConverter

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".AGENTS/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. v1.0.0)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    uses: ./.github/workflows/build-deb.yml
    secrets: inherit

  build-fedora:
    uses: ./.github/workflows/build-fedora.yml
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  publish-release:
    needs: [build-deb, build-fedora, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: image-converter-debian-deb
          path: release-assets

      - name: Download Fedora Package
        uses: actions/download-artifact@v4
        with:
          name: image-converter-fedora-rpm
          path: release-assets

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: image-converter-windows-x64
          path: release-assets

      - name: Determine Tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG_NAME="${{ inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="nightly"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Release ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
