name: Build Debian Package

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            dpkg-dev \
            file \
            ghostscript \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-pdf-dev \
            qt6-l10n-tools

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Create Debian Package (.deb)
        run: |
          cd build
          cpack -G DEB

      - name: Verify and Smoke Test Debian Package
        run: |
          shopt -s nullglob
          packages=(build/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly 1 .deb package, found ${#packages[@]}"
            exit 1
          fi
          pkg="${packages[0]}"
          dpkg-deb -I "$pkg"
          dpkg-deb -f "$pkg" Depends | grep -qw ghostscript
          sudo apt-get install -y "./$pkg"
          test -x /usr/bin/ImageConverter
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5s /usr/bin/ImageConverter
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "Expected ImageConverter offscreen smoke test to stay alive until timeout (exit 124), got $rc"
            exit 1
          fi

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: image-converter-debian-deb
          path: build/*.deb
