name: Build Debian Package

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-cursor0 \
            libdbus-1-3 \
            dpkg-dev \
            file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          modules: "qtpdf qtsvg"
          cache: true

      - name: Fix Qt Environment
        run: |
          if [ -z "$QT_ROOT_DIR" ] && [ -n "$Qt6_DIR" ]; then
            ROOT_DIR=$(dirname $(dirname $(dirname "$Qt6_DIR")))
            echo "QT_ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          fi

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Create Debian Package (.deb)
        run: |
          cd build
          cpack -G DEB

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: image-converter-debian-deb
          path: build/*.deb
